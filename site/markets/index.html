<!doctype html>
<html lang="zh-CN" data-section="markets">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行情快讯 · 星图智策</title>
  <meta name="description" content="每 30 分钟自动汇总 A 股、港股、美股、全球宏观与加密市场的快讯、行情、公告和经济数据">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#051C2C">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23051C2C'/%3E%3Cpath d='M5 22l6-7 5 4 6-9 5 5' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M5 27h22' stroke='%232251FF' stroke-width='2.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#feed" data-i18n="skip">跳到快讯</a>
  <script src="../assets/site.js" data-base="../"></script>

  <section class="band" aria-labelledby="site-name">
    <div class="wrap masthead">
      <div class="brand">
        <h1 id="site-name">行情快讯</h1>
        <p id="tagline" class="tagline"></p>
      </div>
      <div class="masthead-side">
        <p class="updated" id="updated"></p>
        <button type="button" id="color-btn" class="toggle"></button>
      </div>
    </div>
  </section>

  <section class="board-wrap wrap" aria-labelledby="board-title">
    <h2 id="board-title" class="visually-hidden" data-i18n="board">行情</h2>
    <div class="board-tabs" id="board-tabs" role="tablist"></div>
    <div class="board" id="board"></div>
    <p class="board-note" id="board-note"></p>
  </section>

  <div class="layout wrap">
    <main class="feed-col" id="feed">
      <div class="controls">
        <div class="search">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m13 13 4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false">
        </div>
        <div class="chips" id="market-chips" role="radiogroup"></div>
        <div class="filter-row">
          <div class="seg" id="type-seg" role="radiogroup"></div>
          <label class="check"><input type="checkbox" id="imp-only"><span data-i18n="important_only">只看重要</span></label>
        </div>
      </div>
      <p class="result-bar"><span id="result-count" aria-live="polite"></span><button type="button" class="link-btn" id="reset-btn" hidden></button></p>
      <div id="timeline" class="timeline"></div>
      <div class="more"><button type="button" id="more-btn" hidden></button></div>
      <div class="empty" id="empty" hidden></div>
    </main>

    <aside class="side-col" aria-labelledby="macro-title">
      <section class="macro">
        <div class="side-head">
          <h2 id="macro-title" data-i18n="macro">宏观数据</h2>
          <div class="seg small" id="region-seg" role="radiogroup"></div>
        </div>
        <ul class="macro-list" id="macro-list"></ul>
        <p class="side-note" id="macro-note"></p>
      </section>
    </aside>
  </div>

  <footer class="foot">
    <div class="wrap">
      <details class="status">
        <summary id="status-summary"></summary>
        <ul id="status-list"></ul>
      </details>
      <p id="foot-text"></p>
    </div>
  </footer>

  <template id="row-tpl">
    <article class="item">
      <time class="t"></time>
      <div class="c">
        <h3 class="title"><a target="_blank" rel="noopener"></a></h3>
        <p class="summary"></p>
        <p class="meta"><span class="kind"></span><span class="srcs"></span><span class="mk"></span></p>
      </div>
    </article>
  </template>

  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
